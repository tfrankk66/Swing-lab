<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" fill="#061a23"/>
  <!-- swing plane line -->
  <line x1="140" y1="158" x2="58" y2="44" stroke="#01baef" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- shaft -->
  <line x1="88" y1="96" x2="140" y2="158" stroke="#fbfbff" stroke-width="8" stroke-linecap="round"/>
  <!-- clubhead: the one thing the eye should land on first, so it takes the
       palette green the playhead uses rather than another blue -->
  <circle cx="140" cy="158" r="10" fill="#20bf55"/>
  <!-- hands -->
  <circle cx="88" cy="96" r="9" fill="#fbfbff"/>
</svg>
